<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raymond Zhu</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #000;
      font: 1rem / 1.6 system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      max-width: 46rem;
      margin-inline: auto;
      padding: clamp(3.5rem, 13vw, 8rem) clamp(1.5rem, 5vw, 3rem) 3rem;
    }

    h1,
    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      line-height: 1.1;
    }

    h1 {
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      letter-spacing: -0.04em;
    }

    h2 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      letter-spacing: -0.025em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      margin-top: 1.25rem;
    }

    section {
      margin-top: 3.5rem;
      padding-top: 1.75rem;
      border-top: 1px solid #ddd;
    }

    p {
      margin: 0.75rem 0 0;
    }

    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>I’m Raymond Zhu.</h1>
      <nav aria-label="Profiles">
        <a href="https://github.com/InstantRamenPack">GitHub</a>
        <a href="https://www.linkedin.com/in/instantramenpack/">LinkedIn</a>
      </nav>
    </header>
    <section aria-labelledby="projects">
      <h2 id="projects">Projects</h2>
      <p><a href="https://io.rqmxn.dev/">io.rqmxn.dev</a></p>
      <p><a href="https://github.com/InstantRamenPack/squirrel-mod">Squirrel Mod</a></p>
    </section>
  </main>
</body>
</html>
